<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trellixe mark">
  <rect width="64" height="64" rx="15" fill="#13714C"/>
  <!-- trellis stems: two crossing paths for connection -->
  <path d="M20 46 L32 18 L44 46" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crossbar: the trellis -->
  <path d="M24.5 36.5 H39.5" stroke="#3AB67D" stroke-width="4" stroke-linecap="round"/>
  <!-- sprout leaves -->
  <path d="M32 18 C32 12.5 36 9.5 41.5 9.5 C41.5 15 37.5 18.5 32 18 Z" fill="#A2E494"/>
  <circle cx="20" cy="46" r="3.4" fill="#FFFFFF"/>
  <circle cx="44" cy="46" r="3.4" fill="#FFFFFF"/>
</svg>
